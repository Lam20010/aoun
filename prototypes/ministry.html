@keyframes aounPulse{0%{box-shadow:0 0 0 0 rgba(46,155,214,.55)}100%{box-shadow:0 0 0 10px rgba(46,155,214,0)}}
.aoun-in{animation:aounIn .5s cubic-bezier(.2,.7,.2,1)}
.aoun-feed{animation:aounFeed .45s ease-out}
.aoun-live{animation:aounPulse 1.6s ease-out infinite}
.aoun-region:hover{filter:brightness(.93)}
.aoun-hex:hover{filter:brightness(.93)}
@media (prefers-reduced-motion: reduce){.aoun-in,.aoun-feed,.aoun-live{animation:none}}
</style>

<style>
  /* iOS feel: system font, press feedback, no web focus glow, smooth scroll */
  html, body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, a.ios-btn { font-family: inherit !important; -webkit-appearance: none; touch-action: manipulation; transition: opacity .12s ease, transform .12s ease; }
  button:active, a.ios-btn:active { opacity: .55; }
  button:focus-visible, a.ios-btn:focus-visible { outline: 3px solid #59C2F9; outline-offset: 2px; }
  * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }
</style>

        <span style="font-size: 12px; color: #D6EEFC">منصة وزارة الصحة</span>
      </div>
    </div>
    <nav aria-label="أقسام المنصة" style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
        <button onClick="{{tb.pick}}" aria-current="{{tb.current}}" style="text-align: right; min-height: 50px; border-radius: 14px; border: none; padding: 0 14px; background: {{tb.bg}}; color: #FFFFFF; font-size: 15px; font-weight: {{tb.weight}}; display: flex; align-items: center; gap: 12px; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tb.d}}"></path></svg>
          {{tb.label}}
        </button>
      </sc-for>
    </nav>
    <div style="margin-top: auto; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px"><span class="aoun-live" style="width: 10px; height: 10px; border-radius: 5px; background: #6FE0B5"></span><b style="font-size: 13px">رفيدة تعمل الآن</b></div>
      <span style="font-size: 12px; line-height: 1.7; color: #D6EEFC">{{liveCount}} محادثة جارية مع المستفيدين في كل المناطق</span>
    </div>
    <div style="font-size: 11px; line-height: 1.7; color: #C3DAE4; padding: 0 6px">كل الأرقام مجمّعة ومجهّلة، ولا تُعرض أي مجموعة أقل من 50 شخصًا.</div>
  </aside>

  <main style="flex: 999 1 600px; min-width: 0; box-sizing: border-box; padding: 26px clamp(14px, 2.6vw, 34px); display: flex; flex-direction: column; gap: 18px">

    <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; background: rgba(255,255,255,.75); border: 1px solid #FFFFFF; border-radius: 22px; padding: 16px 20px; box-shadow: 0 6px 24px rgba(7,83,114,.06)">
      <div style="display: flex; align-items: center; gap: 14px">
        <div style="width: 52px; height: 52px; border-radius: 16px; background: #E5F3FC; color: #1574AD; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15M15 6v15"></path></svg>
        </div>
        <div>
          <h1 style="margin: 0; font-size: 24px">منصة عون · الكشف المبكر والوقاية</h1>
          <nav aria-label="المسار" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13px; margin-top: 2px">
            <sc-for list="{{crumbs}}" as="cr" hint-placeholder-count="2">
              <span style="display: flex; align-items: center; gap: 4px">
                <button onClick="{{cr.go}}" style="border: none; background: transparent; padding: 4px 2px; min-height: 30px; color: {{cr.color}}; font-weight: {{cr.weight}}; font-size: 13px; cursor: pointer">{{cr.label}}</button>
                <sc-if value="{{cr.sep}}" hint-placeholder-val="{{ true }}"><span style="color: #8BA096">‹</span></sc-if>
              </span>
            </sc-for>
          </nav>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
        <div role="group" aria-label="الفترة" style="display: flex; background: #E5F3FC; border-radius: 12px; padding: 4px">
          <sc-for list="{{ranges}}" as="rg" hint-placeholder-count="3">
            <button onClick="{{rg.pick}}" aria-pressed="{{rg.selected}}" style="min-height: 36px; padding: 0 12px; border: none; border-radius: 9px; background: {{rg.bg}}; color: {{rg.color}}; font-size: 13px; font-weight: 600; cursor: pointer">{{rg.label}}</button>
          </sc-for>
        </div>
        <span style="font-size: 12px; font-weight: 600; background: {{dataBadgeBg}}; color: {{dataBadgeInk}}; padding: 8px 12px; border-radius: 12px">{{dataBadge}}</span><button onClick="{{logout}}" style="font-size: 12px; font-weight: 600; background: #FFFFFF; color: #1574AD; border: 1px solid #DBE6EC; padding: 7px 12px; border-radius: 12px; cursor: pointer">خروج</button>
      </div>
    </header>

    <sc-if value="{{notSettings}}" hint-placeholder-val="{{ true }}">
    <!-- KPIs -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 12px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="6">
        <div style="background: rgba(255,255,255,.85); border: 1px solid #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 6px 20px rgba(7,83,114,.05)">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-size: 13px; color: #4A5E6D; font-weight: 500">{{k.label}}</span>
            <span style="width: 34px; height: 34px; border-radius: 11px; background: #E5F3FC; color: #1574AD; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.d}}"></path></svg></span>
          </div>
          <span style="font-size: 30px; font-weight: 700; color: #0E2E45; line-height: 1.1">{{k.value}}</span>
          <span style="font-size: 12px; font-weight: 600; color: {{k.subColor}}">{{k.sub}}</span>
        </div>
      </sc-for>
    </div>
    </sc-if>

    <!-- ================= الرئيسية ================= -->
    <sc-if value="{{is.home}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: stretch">

          <section style="flex: 1.7 1 520px; min-width: 0; background: rgba(255,255,255,.88); border: 1px solid #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 28px rgba(7,83,114,.07)">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap">
              <div>
                <h2 style="margin: 0; font-size: 19px">{{mapTitle}}</h2>
                <span style="font-size: 12px; color: #4A5E6D">{{mapHint}}</span>
              </div>
              <sc-if value="{{canBack}}" hint-placeholder-val="{{ false }}">
                <button onClick="{{back}}" style="min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid #CEDCE3; background: #FFFFFF; color: #1574AD; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
                  تصغير
                </button>
              </sc-if>
            </div>

            <div style="position: relative; border-radius: 18px; background: radial-gradient(ellipse at 50% 40%, #F7FAFB 0%, #E2ECF1 100%); overflow: hidden">
              <sc-if value="{{showKingdomMap}}" hint-placeholder-val="{{ true }}">
                <div style="position: relative; width: 100%; aspect-ratio: 730 / 600">
                  <svg viewBox="0 0 730 600" role="img" aria-label="خريطة مناطق المملكة ملونة حسب نسبة إكمال الفحوصات" style="position: absolute; inset: 0; width: 100%; height: 100%">
                    <g style="transform: {{mapT}}; transform-origin: 0 0; transition: transform .8s cubic-bezier(.2,.7,.2,1)">
                      <sc-for list="{{regionShapes}}" as="r" hint-placeholder-count="13">
                        <path class="aoun-region" d="{{r.d}}" fill="{{r.fill}}" stroke="#FFFFFF" stroke-width="1.6" vector-effect="non-scaling-stroke" opacity="{{r.op}}" onClick="{{r.pick}}" onMouseEnter="{{r.enter}}" onMouseLeave="{{leave}}" style="cursor: pointer; transition: opacity .5s, fill .4s"></path>
                      </sc-for>
                    </g>
                  </svg>
                  <sc-for list="{{regionLabels}}" as="l" hint-placeholder-count="13">
                    <span style="position: absolute; left: {{l.left}}; top: {{l.top}}; transform: translate(-50%, -50%); pointer-events: none; font-size: {{l.fs}}; font-weight: 700; color: #0E2E45; background: rgba(255,255,255,.85); padding: 2px 9px; border-radius: 10px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.08)">{{l.name}}</span>
                  </sc-for>
                  <sc-for list="{{cityPins}}" as="c" hint-placeholder-count="4">
                    <button class="aoun-in" onClick="{{c.pick}}" onMouseEnter="{{c.enter}}" onMouseLeave="{{leave}}" style="position: absolute; left: {{c.left}}; top: {{c.top}}; transform: {{c.tf}}; display: flex; flex-direction: {{c.dir}}; align-items: center; gap: 3px; border: none; background: transparent; padding: 0; cursor: pointer; z-index: 2">
                      <span style="background: #FFFFFF; border-radius: 12px; padding: 5px 10px; font-size: 13px; font-weight: 700; color: #0E2E45; box-shadow: 0 3px 10px rgba(0,0,0,.15); display: flex; align-items: center; gap: 6px; white-space: nowrap">{{c.name}}<span style="background: {{c.fill}}; color: {{c.ink}}; border-radius: 8px; padding: 0 7px">{{c.pct}}%</span></span>
                      <span style="width: 16px; height: 16px; border-radius: 8px; background: #1574AD; border: 3px solid #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.3); box-sizing: border-box"></span>
                    </button>
                  </sc-for>
                </div>
              </sc-if>
              <sc-if value="{{geoLoading}}" hint-placeholder-val="{{ false }}">
                <div style="aspect-ratio: 730 / 600; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4A5E6D">جاري تحميل الخريطة…</div>
              </sc-if>

              <sc-if value="{{showCityMap}}" hint-placeholder-val="{{ false }}">

      submit: () => this.login() };
    v.logout = () => this.logout();
    v.dataBadge = L ? "مباشر من التجربة · بقية المملكة محاكاة" : "بيانات تجريبية للعرض";
    v.dataBadgeBg = L ? "#E5F3FC" : "#FBF5D6";
    v.dataBadgeInk = L ? "#1574AD" : "#6B5A08";
    v.is = Object.assign({}, v.is, { calls: s.tab === "calls" });
    v.ins = this.insightsVals();
    if (!L) { v.livePanel = { show: false }; return v; }

    v.liveCount = fmtN(1240 + (s.tick * 37) % 400 + L.calls_now);
    const ivAll = L.interventions, approved = ivAll.filter((x) => x.status === "approved");

    // Live feed first, then the board's own simulated lines.
    const liveFeed = L.feed.slice(0, 5).map((f, j) => {
      const st = FEED_STYLE[f.kind] || FEED_STYLE.booked;
      return { text: f.text_ar, bg: st[0], color: st[1], d: st[2], time: ago(f.at), cls: j === 0 ? "aoun-feed" : "" };
    });
    v.feed = liveFeed.concat(v.feed).slice(0, 5);

    // Active interventions: the approved ones from the server come first.
    const liveActive = approved.slice(0, 4).map((iv) => {
      const st = IV_STYLE[iv.kind] || IV_STYLE.challenge;
      const x = L.districts.find((d) => d.key === iv.district) || {};
      const status = iv.kind === "mobile_clinic" || iv.kind === "evening_hours" ? iv.slots + " موعد جديد · " + fmtN(x.booked || 0) + " حجز في الحي"
        : iv.kind === "transport" ? "مشاوير مجانية للمواعيد" : iv.kind === "challenge" ? "يظهر في تطبيق كل ساكن" : "رفيدة تتصل بلغتهم";
      return { title: iv.title_ar, where: "حي " + iv.district_ar + "، الرياض · اعتُمد " + ago(iv.approved_at), prog: Math.min(95, 20 + (x.booked || 0) * 8) + "%",
        status, bg: st[0], color: st[1], d: st[2] };
    });
    v.active = liveActive.concat(v.active).slice(0, 4);

    // KPI "active interventions"
    v.kpis = v.kpis.map((k) => k.label === "تدخلات نشطة" ? Object.assign({}, k, { value: String(parseInt(k.value, 10) + approved.length), sub: approved.length + " اعتمدتها عبر عون" }) : k);

    // A pilot district: real suggestions with a real "approve".
    const hoodName = s.hood, cityName = s.city;
    const pilot = cityName === "الرياض" && hoodName ? L.districts.find((d) => d.ar === hoodName) : null;
    if (pilot) {
      const mine = ivAll.filter((x) => x.district === pilot.key);
      const kinds = ["mobile_clinic", "evening_hours", "transport", "language", "challenge"];
      const LBL = { mobile_clinic: "يضيف ٩ مواعيد مجانية عند جامع الحي", evening_hours: "يضيف مواعيد ٨ و٩ بالليل لأسبوع", transport: "المشوار للموعد مجاني لسكان الحي",
        language: "رفيدة تتصل بالأوردو والهندية والبنغالية", challenge: "هدف جماعي يظهر في تطبيق السكان ولعبة حيّ عون" };
      const TITLE = { mobile_clinic: "عيادة متنقلة عند جامع الحي", evening_hours: "مواعيد مسائية", transport: "دعم المواصلات", language: "تواصل بلغات العمالة", challenge: "تحدي «حيّ صحي»" };
      const topBar = Object.entries(pilot.barriers).sort((p, q) => q[1] - p[1])[0];
      v.hoodRecs = kinds.map((k) => {
        const iv = mine.find((x) => x.kind === k && x.status === "approved") || mine.find((x) => x.kind === k);
        const done = !!(iv && iv.status === "approved"), st = IV_STYLE[k];
        return { title: TITLE[k], why: LBL[k] + (k === "mobile_clinic" && topBar ? ". أكثر سبب ذكره السكان لرفيدة: «" + topBar[0] + "»." : "."),
          impact: done ? (iv.slots ? "أُضيف " + iv.slots + " موعد للحجز" : "مفعّل الآن") : "يصل للتطبيق ورفيدة فور الاعتماد",
          d: st[2], bg: st[0], color: st[1], done, pending: !done,
          approve: () => (iv ? this.approveLive(iv.id) : this.proposeLive(pilot.key, k)) };
      });
      const bars = Object.entries(pilot.barriers).sort((p, q) => q[1] - p[1]).slice(0, 4);
      v.livePanel = { show: true, title: "مباشر من تجربة عون في حي " + pilot.ar,
        stats: [["حجوزات", pilot.booked], ["نتائج أدخلها الأطباء", pilot.results], ["اكتشاف مبكر", pilot.early], ["إحالات", pilot.referrals],
          ["دقائق مشي في ممشى الحي", pilot.walk_minutes], ["جيران ساعدوهم في حيّ عون", pilot.helped]].map(([k, n]) => ({ k, n: fmtN(n) })),
        bars: bars.map(([k, n]) => ({ k, n: fmtN(n) })), hasBars: bars.length > 0,
        note: "أعداد مجمّعة للحي فقط، بدون أي اسم أو رقم أو تشخيص. تتحدث كل ٦ ثوانٍ." };
    } else {
      v.livePanel = { show: false };
    }

    // The interventions table: approving a pilot district goes to the server.
    v.actionRows = (v.actionRows || []).map((r) => {
      const x = r.city === "الرياض" ? L.districts.find((d) => d.ar === r.name) : null;
      if (!x) return r;
      const mine = ivAll.filter((iv) => iv.district === x.key);
      const done = mine.some((iv) => iv.status === "approved"), first = mine.find((iv) => iv.status === "proposed");
      return Object.assign({}, r, { name: r.name + " · مباشر", done, pending: !done, approve: () => first && this.approveLive(first.id) });
    });
    return v;
  }

  /* «صوت الأحياء»: the reasons people gave on the calls, per district, and what fixed them. */
  insightsVals() {
    const I = this.state.ins;
    if (!I) return { loading: true, kpis: [], reasons: [], worked: [], cols: [], heat: [], heatCells: [], ncols: 1, cards: [], withReason: "—", note: "" };
    const n = (x) => (x === null || x === undefined ? "<5" : fmtN(x));
    const pct = (a, b) => (a && b ? Math.round(a * 100 / b) + "%" : "—");
    const c = I.city;
    const kpis = [["اتصال من رفيدة ورفيد", n(c.contacted)], ["ردّوا على المكالمة", pct(c.answered, c.contacted)],
      ["ذكروا سببًا", n(I.city_with_reason)], ["حجزوا", pct(c.booked, c.contacted)],
      ["نتائج وصلت من الأطباء", n(c.results)], ["طلبوا عدم الاتصال", n(c.opted_out)]].map(([k, v]) => ({ k, n: v }));
    const PAL = ["#1574AD", "#C98A1B", "#7A3E8F", "#3D5F94", "#B5523B", "#4B5512", "#3BA6E0", "#8C6D3F", "#6A7883", "#A0446B"];
    const colorOf = {}; I.reasons.forEach((r, i) => { colorOf[r.code] = PAL[i % PAL.length]; });
    const maxR = Math.max(1, ...I.reasons.map((r) => r.n || 0));
    const reasons = I.reasons.slice(0, 8).map((r) => ({ ar: r.ar, n: n(r.n), w: Math.round((r.n || 2) * 100 / maxR) + "%", color: colorOf[r.code] }));
    const worked = I.worked.slice(0, 7).map((w) => ({ ar: w.ar, best: "الأنجح: " + w.best_ar + (w.solutions[1] ? " · ثم " + w.solutions[1].ar : ""), pct: w.best_pct + "%" }));
    const cols = I.reasons.slice(0, 7);
    const heat = I.districts.map((d) => {
      const tot = Object.values(d.barriers).reduce((a, x) => a + (x || 0), 0);
      return { ar: d.ar, cells: cols.map((col) => {
        const v = d.barriers[col.code];
        if (v === undefined || v === 0) return { t: "—", bg: "#F6F8F9", ink: "#99A4AC" };
        if (v === null) return { t: "<5", bg: "#F1F3F4", ink: "#7D8B96" };
        const p = tot ? v / tot : 0, a = Math.min(1, 0.12 + p * 2.2);
        return { t: Math.round(p * 100) + "%", bg: "rgba(21,116,173," + a.toFixed(2) + ")", ink: a > 0.5 ? "#FFFFFF" : "#0E2E45" };
      }) };
    });
    const RIDE = { car: "سيارة", metro: "مترو", car_wheelchair: "سيارة للكرسي المتحرك" };
    const L = I.labels || {};
    const cards = I.districts.map((d) => {
      const asks = [];
      const push = (obj, lbl, pre) => Object.entries(obj || {}).sort((a, b) => (b[1] || 0) - (a[1] || 0)).slice(0, 3)
        .forEach(([k, v]) => asks.push((pre || "") + (lbl[k] || k) + " · " + n(v)));
      push(d.prefs, L.prefs || {}); push(d.rides, RIDE, "مشوار "); push(Object.fromEntries(Object.entries(d.langs || {}).filter(([k]) => k !== "ar")), L.langs || {}, "لغة ");
      const sg = d.suggestion, busy = sg && sg.intervention_id && this.state.busy[sg.intervention_id];
      return { ar: d.ar, en: d.en,
        funnel: [["تواصلنا", n(d.contacted)], ["ردّوا", n(d.answered)], ["حجزوا", n(d.booked)], ["حُلّ عائقهم", n(d.solved)]].map(([k, v]) => ({ k, n: v })),
        top: d.top.slice(0, 3).map((t) => ({ ar: t.ar, pct: t.pct + "%", w: t.pct + "%", color: colorOf[t.code] || "#1574AD" })),
        asks: asks.slice(0, 6), hasAsks: asks.length > 0,
        hasSug: !!sg, sugTitle: sg ? sg.title_ar : "", sugWhy: sg ? "لأن أكثر سبب في الحي: «" + sg.because_ar + "». " + sg.detail_ar : "",
        sugPending: !!sg && sg.status !== "approved", sugDone: !!sg && sg.status === "approved", sugBtn: busy ? "جاري الاعتماد…" : "اعتماد",
        approve: () => sg && (sg.intervention_id ? this.approveLive(sg.intervention_id) : this.proposeLive(d.key, sg.kind)) };
    });
    const heatCells = [];
    heat.forEach((r) => { heatCells.push({ t: r.ar, bg: "transparent", ink: "#0E2E45", align: "right", weight: 700 });
      r.cells.forEach((c) => heatCells.push(Object.assign({ align: "center", weight: 600 }, c))); });
    return { loading: false, kpis, reasons, worked, cols, heat, heatCells, ncols: cols.length, cards, withReason: n(I.city_with_reason),
      note: "أعداد مجمّعة لكل حي من رموز ثابتة فقط، وأي خانة أقل من " + I.small_cell + " أشخاص تظهر «<5». آخر تحديث " + ago(I.updated_at) + "." };
  }

}

window.__dc = DCmount(document.getElementById("dc-root"), document.getElementById("dc-tpl"), AounMinistry, {});
</script>
