# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: aoun-voice-tools
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: AOUN_TOOL_KEY
        generateValue: true
      - key: AOUN_ADMIN_KEY
        generateValue: true
      - key: AOUN_PHONE_ENC_KEY
        generateValue: true
      - key: AOUN_WEBHOOK_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_PHONE_NUMBER_ID
        sync: false
      - key: AOUN_PUBLIC_BASE_URL
        value: https://aoun-voice-tools.onrender.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: AOUN_DEMO_MODE
        value: "1"   # lets a dashboard/web test conversation use a session opened in the last 15 minutes
      - key: AOUN_GOOGLE_MAPS_KEY
        sync: false   # optional: real routes and travel times (server only)
      - key: AOUN_MINISTRY_PASSWORD
        sync: false   # optional: Ministry board password (demo mode falls back to the demo password)
