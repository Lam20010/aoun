  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"ar\"><head>\n<meta charset=\"utf-8\">\n<title>عون · تجربة حيّة<\u002Ftitle>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"theme-color\" content=\"#000000\">\n<style>html,body{background:#000;margin:0;height:100%;overflow:hidden;overscroll-behavior:none}<\u002Fstyle>\n<script>\n(function(){\n  function fit(){\n    var el=document.querySelector('div[style*=\"width: 393px\"][style*=\"height: 852px\"]');\n    if(!el)return;\n    var w=window.innerWidth,h=window.innerHeight,s=Math.min(w/393,h/852);\n    el.style.transformOrigin='top left';\n    el.style.transform='scale('+s+')';\n    el.style.position='absolute';\n    el.style.left=Math.max(0,(w-393*s)/2)+'px';\n    el.style.top=Math.max(0,(h-852*s)/2)+'px';\n  }\n  window.addEventListener('resize',fit);\n  new MutationObserver(fit).observe(document.documentElement,{childList:true,subtree:true});\n  document.addEventListener('DOMContentLoaded',fit);\n})();\n<\u002Fscript>\n<script src=\"70520d70-0ca4-4381-ab5b-11e65450dc40\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0}\na{color:#2F7F80}\nbutton{font-family:inherit;-webkit-tap-highlight-color:transparent;transition:opacity .12s ease}\nbutton:active{opacity:.55}\nbutton:focus-visible,a:focus-visible{outline:3px solid #96D7C6;outline-offset:2px}\n@keyframes ao-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n@keyframes ao-pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.55)}100%{box-shadow:0 0 0 22px rgba(52,199,89,0)}}\n@keyframes ao-ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.6);opacity:0}}\n@keyframes ao-wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}\n@keyframes ao-glow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}\n@keyframes ao-drop ine-height: 1.35\">{{alert.title}}<\u002Fb>\n          <span style=\"font-size: 13px; line-height: 1.5\">{{alert.body}}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{alert.btns}}\" as=\"ab\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ab.run}}\" style=\"display: block; width: 100%; min-height: 46px; border: none; border-top: 1px solid #D3DEDB; background: transparent; color: #4D6FA8; font-size: 17px; font-weight: {{ab.w}}; cursor: pointer\">{{ab.t}}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    // مقاطع ElevenLabs (صوت حنين لرفيدة، أبو فهد لرفيد) — تُعبّأ بروابط /_blob/ لما تتولّد. لو ما فيه مقطع، يقرأ صوت الجوال.\n    this.CLIPS = { f: {}, m: {} };\n    this.LINES = {\n      g1a: \"الحمدلله، دوم يا رب.\",\n      g1b: \"معك خدمة عون من وزارة الصحة، وأتصل عليك عشان أتطمّن عليك.\",\n      g1: \"السلام عليكم يا خالة حصة، معك عون من وزارة الصحة. عساك بخير وصحة؟\",\n      intro: \"وبالمناسبة، أنا رفيدة، وبكون معك خطوة بخطوة.\",\n      g2: \"ترى رتّبت لك موعد فحص بسيط، كله عشان نتطمّن عليك، لا تشيلين هم.\",\n      g3: \"يوم الخميس الساعة أربع ونص العصر، في مركز صحي النسيم القريب منك. يناسبك هالوقت؟\",\n      loc1: \"قبل ما نكمل، تسمحين لي أشوف موقعك؟ بس عشان أختار لك أقرب مكان وأريح مشوار.\",\n      locY: \"الله يعطيك العافية. شفت إنك في حي النسيم، يعني المركز قريب منك.\",\n      locN: \"ولا يهمك أبد، بعتمد على حيّك المسجّل في صحتي، حي النسيم.\",\n      r1: \"ولا يهمك، المهم اللي يريحك. قولي لي على راحتك، وش اللي مصعّبها عليك؟\",\n      t0: \"أبشري، المشوار علي ولا تحاتين. تفضّلين سيارة توصلك لين الباب، ولا المترو؟\",\n      t1: \"حلو. كم واحد بيروح معك؟ عشان أختار لك سيارة مريحة.\",\n      tbook: \"حجزتها لك مبدئيًا في أوبر، ومتى ما حبيتي تأكّدينها، الزر قدامك.\",\n      t2a: \"تمام، سيارة عادية مريحة.\",\n      t2b: \"تمام، سيارة عائلية واسعة تكفيكم كلكم.\",\n      t2c: \"أبشري، سيارة مجهّزة للكرسي المتحرك، ومركز يدعم الكرسي بعد.\",\n      t3: \"ومتى يريحك تمرّك السيارة؟\",\n      t4a: \"تم، الساعة أربع إن شاء الله.\",\n      t4b: \"تم، الساعة ثلاث ونص، على راحتك.\",\n      tm: \"حلو، أقرب محطة لك محطة الحي، خمس دقايق مشي بس. جهّزت لك التذكرة في درب، وتقدرين تأكّدينها من الزر.\",\n      f1: \"معك حق، المشوار الطويل يتعب. عندي لك خيارين أقرب:\",\n      f2m: \"زين! العيادة المتنقلة عند جامع الحي، ستمية وخمسين متر بس من بيتك، يوم الخميس الساعة خمس.\",\n      f2h: \"أبشري، الفريق الصحي يجيك لين البيت، يوم الخميس الساعة أربع ونص.\",\n      w1: \"ولا يهمك، وش الوقت اللي يريحك أكثر؟\",\n      w2a: \"تم، رتّبته لك يوم الأحد الساعة ثمان ونص الصبح.\",\n      w2b: \"تم، رتّبته لك يوم الأربعاء الساعة سبع المسا.\",\n      w2c: \"تم، رتّبته لك يوم السبت الساعة عشر الصبح.\",\n      s1: \"أفهمك والله، وكثير يحسّون نفس الشعور، وهذا طبيعي.\",\n      s2: \"الفحص بسيط، نقطة دم صغيرة من الإصبع، دقيقتين وتخلصين. وبتكون معك طبيبة لطيفة، وأنا معك من أول لين آخر.\",\n      a1: \"سؤال في محلّه. السكر أحيانًا يجي بهدوء، بدون أي أعراض.\",\n      a2: \"واللي يكشفه بدري يرتاح سنين، ويبقى قريب من عياله وأحفاده بصحة وعافية.\",\n      p1: \"باقي شي بسيط يخلّي يومك أسهل. تحبين أرتّب لك شي من هذي؟\",\n      p2: \"مين تحبين يوصله التنبيه عنك؟\",\n      p3: \"تمام، يوصله التذكير بس، ونتايجك تبقى لك أنتِ.\",\n      k0: \"خليني أقرأ لك الخطة على هدوء.\",\n      pw_thu: \"الخميس، أربع ونص العصر.\",\n      pw_thu5: \"الخميس، الساعة خمس.\",\n      pw_sun: \"الأحد، ثمان ونص الصبح.\",\n      pw_wed: \"الأربعاء، سبع المسا.\",\n      pw_sat: \"السبت، عشر الصبح.\",\n      pp_center: \"في مركز صحي النسيم.\",\n      pp_mobile: \"عند العيادة المتنقلة.\",\n      pp_home: \"في بيتك.\",\n      pr_4: \"سيارة تمرّك الساعة أربع، وترجّعك.\",\n      pr_330: \"سيارة تمرّك الساعة ثلاث ونص، وترجّعك.\",\n      pr_metro: \"بالمترو، والمسار على الخريطة.\",\n      pc: \"والمرافق يوص
