<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عون · بوابة الطبيب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: blue sidebar at the start (right), a top bar, summary tiles, today's list beside the patient card,
   then the patient workspace (record, results, notes, medicines, messages). */
:root{
  /* the Aoun app palette (mobile/src/theme.ts) */
  --bg:#F3F8F6;--card:#fff;--ink:#173F42;--soft:#4E5C5E;--muted:#7E8C8E;--line:#E3ECEA;
  --blue:#0F2E30;--blue-2:#1E4A4D;--blue-soft:#D5EFE8;--teal:#2F7F80;--teal-soft:#D5EFE8;
  --amber:#6B5A08;--amber-soft:#F6F0C4;--red:#C2410C;--red-soft:#FDE4DA;--violet:#4F6FA8;--violet-soft:#E3E8F6;
  --side-a:#6C8CBF;--side-b:#5AA7A7;--accent:#2F7F80;--mint:#96D7C6;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px}
.hide{display:none!important}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* buttons, inputs */
.btn{border:0;border-radius:999px;padding:9px 16px;background:var(--blue);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--blue-2)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.small{padding:6px 12px;font-size:13px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--soft);margin:10px 0 4px}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(29,43,79,.04)}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
#login .card{width:100%;max-width:420px;padding:28px}
#login .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
#login .brand img{width:44px;height:44px}
#login h1{margin:0;font-size:22px}
.hint{background:var(--amber-soft);color:#6B5A08;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}

/* shell */
#app{display:grid;grid-template-columns:240px 1fr;gap:20px;min-height:100%;padding:20px;max-width:1440px;margin:auto}
.side{background:linear-gradient(170deg,var(--side-a),var(--side-b));color:#fff;border-radius:18px;padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:20px;height:calc(100vh - 40px)}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.side .brand img{width:34px;height:34px;background:#fff;border-radius:10px;padding:4px}
.side .brand b{font-size:17px}
.doc{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.doc .av{width:78px;height:78px;border-radius:50%;background:#fff;color:var(--teal);display:grid;place-items:center;font-size:26px;font-weight:700;border:4px solid rgba(255,255,255,.35)}
.doc b{font-size:16px;margin-top:6px}
.doc span{font-size:13px;opacity:.85}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:#fff;opacity:.85;padding:10px 12px;border-radius:10px;text-align:start;font-weight:500}
.nav button:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav button.on{background:#fff;color:var(--ink);opacity:1;font-weight:700}
.nav .badge{margin-inline-start:auto;background:#BAC94A;color:#0F2E30;border-radius:999px;font-size:11px;padding:0 7px;font-weight:700}
.side .out{margin-top:auto}

.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px}
.top .sub{font-size:13px;color:var(--muted)}
.top .acts{display:flex;align-items:center;gap:18px;color:var(--soft);font-size:14px}
.top .acts span{display:inline-flex;align-items:center;gap:6px;position:relative}
.top .dot{position:absolute;top:-6px;inset-inline-start:8px;background:var(--teal);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;font-weight:700}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{display:flex;align-items:center;gap:14px}
.stat .i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.stat .i .ico{width:20px;height:20px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}

.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:15px;font-weight:700}
.sec-t small{color:var(--muted);font-weight:500}
.list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.appt{display:flex;align-items:center;gap:12px;border:0;border-radius:12px;padding:10px 12px;background:#fff;text-align:start;width:100%}
.appt:hover{background:#F3F8F6}
.appt.on{background:var(--blue-soft)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px}
.appt .who{flex:1;min-width:0}
.appt .t{font-weight:700;font-size:14px}
.appt.on .t{color:var(--teal)}
.appt .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .tm{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;text-align:end}
.appt .tm small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.appt.on .tm{color:var(--teal)}

.pcard{box-shadow:0 12px 30px rgba(15,46,48,.10);background:linear-gradient(160deg,#CBEDE2,#A9DCCD)}
.pcard .av{background:#fff!important}
.ph{display:flex;align-items:center;gap:14px}
.ph .av{width:60px;height:60px;font-size:18px}
.ph h2{margin:0;font-size:18px}
.ph .s{font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px;margin:18px 0}
.facts small{display:block;color:var(--muted);font-size:12px}
.facts b{font-size:14px;font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border-radius:8px;padding:3px 10px;font-size:12px;font-weight:600}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-teal{background:var(--teal-soft);color:var(--teal)}
.t-violet{background:var(--violet-soft);color:var(--violet)}
.t-blue{background:var(--blue-soft);color:var(--blue)}
.pacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--teal-soft);color:var(--teal)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.gray{background:#EEF1F7;color:var(--soft)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}

.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);margin:-4px 0 16px}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--soft);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;display:inline-flex;gap:8px;align-items:center}
.tabs button.on{color:var(--teal);border-bottom-color:var(--teal)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .v{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.rec .src{font-size:12px;color:var(--muted)}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto;padding:4px}
.msg{max-width:75%;padding:9px 12px;border-radius:14px;background:#D5EFE8}
.msg.me{align-self:flex-start;background:var(--blue);color:#fff}
.msg.them{align-self:flex-end}
.msg small{display:block;opacity:.7;font-size:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;background:#fff}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.empty{color:var(--muted);text-align:center;padding:36px 10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;z-index:9}
.note{background:var(--amber-soft);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.note small{color:var(--soft)}
h3{margin:18px 0 8px;font-size:16px}
.info{background:#E3E8F6;color:#173F42;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}

@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.row2{grid-template-columns:1fr}}
@media (max-width:820px){#app{grid-template-columns:1fr;padding:12px}.side{position:static;height:auto}.nav{flex-direction:row;flex-wrap:wrap}.doc,.side .out{display:none}}
@media (max-width:560px){.grid2,.facts{grid-template-columns:1fr 1fr}.stats{gap:10px}}
</style>
</head>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try { return sessionStorage.getItem(k) || ''; } catch(e){ return ''; } }, set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }, del(k){ try { sessionStorage.removeItem(k); } catch(e){} } };
let token = store.get('aoun_dr');
let CAT = null, ME = null, current = null, tab = 'record', D = null;
const LANG = {ar:'العربية',en:'English',ur:'اردو',hi:'हिन्दी',bn:'বাংলা',fil:'Filipino',id:'Indonesia'};
const FLAG = {normal:['طبيعي',''],borderline:['حدّي','amber'],high:['مرتفع','red'],low:['منخفض','amber'],positive:['إيجابي','red'],negative:['سلبي','']};
const PREF = {female_doctor:'طبيبة',wheelchair_center:'يدعم الكرسي المتحرك',home_test:'فحص منزلي',companion_reminders:'مرافق يستلم التذكير'};
const FAM = {diabetes:'سكري في العائلة',hypertension:'ضغط في العائلة',heart:'أمراض قلب في العائلة',colorectal:'سرطان قولون في العائلة',breast:'سرطان ثدي في العائلة',sickle_cell:'فقر دم منجلي',thalassemia:'ثلاسيميا',familial_hypercholesterolemia:'كوليسترول عائلي'};
const KIND = {hospital:'مستشفى',private_clinic:'عيادة خاصة',lab:'مختبر',phc:'مركز صحي'};
const AVC = [['var(--violet-soft)','var(--violet)'],['var(--teal-soft)','var(--teal)'],['var(--amber-soft)','var(--amber)'],['var(--blue-soft)','var(--blue)']];
const icon = (n) => `<svg class="ico"><use href="#i-${n}"/></svg>`;
const avatar = (alias, i, cls='') => { const [b,f] = AVC[i % AVC.length]; const t = String(alias).split('#').pop().slice(0,2); return `<span class="av ${cls}" style="background:${b};color:${f}">${esc(t)}</span>`; };

function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hide'),2600)}
async function api(path, opts={}){
  const r = await fetch('/doctor/api'+path, {...opts, headers:{'content-type':'application/json', ...(token?{authorization:'Bearer '+token}:{}) }});
  if (r.status===401){ token=''; store.del('aoun_dr'); showLogin(); throw new Error('401'); }
  const j = await r.json().catch(()=>({}));
  if (!r.ok) { toast(({genetic_results_are_not_stored:'النتائج الجينية ما تنحفظ. أرسل إحالة لاستشارة وراثية.',file_too_large:'الملف أكبر من 5 ميجا',pdf_png_or_jpeg_only:'PDF أو صورة فقط',not_your_patient:'هذا المراجع مو محجوز عندك'})[String(j.detail||'').split(':')[0]] || 'صار خطأ، جرّب مرة ثانية'); throw new Error(j.detail); }
  return j;
}
const date = (s) => new Date(s).toLocaleDateString('ar-SA-u-nu-latn',{day:'numeric',month:'short',year:'numeric'});
const dt = (s) => new Date(s).toLocaleString('ar-SA-u-nu-latn',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const tm = (s) => new Date(s).toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Riyadh'});
const dy = (s) => new Date(s).toLocaleDateString('ar-SA-u-nu-latn',{weekday:'short',day:'numeric',month:'short',timeZone:'Asia/Riyadh'});

async function showLogin(){
  $('app').classList.add('hide'); $('login').classList.remove('hide');
  const c = await fetch('/doctor/api/config').then(r=>r.json());
  $('docSel').innerHTML = c.doctors.map(d=>`<option value="${d.id}">${esc(d.name_ar)} · ${esc(d.facility_ar)}</option>`).join('');
  if (c.demo_code){ $('demoHint').classList.remove('hide'); $('demoHint').textContent = 'نسخة تجريبية ببيانات وهمية. رمز الدخول: '+c.demo_code; }
}
$('loginBtn').onclick = async () => {
  try { const j = await api('/login',{method:'POST',body:JSON.stringify({doctor_id:$('docSel').value, code:$('code').value})});
    token=j.token; store.set('aoun_dr',token); start(); } catch(e){}
};
$('logout').onclick = () => { token=''; store.del('aoun_dr'); current=null; showLogin(); };
document.querySelectorAll('#nav [data-v]').forEach(b=>b.onclick=()=>{
  const v=b.dataset.v; document.querySelectorAll('#nav [data-v]').forEach(x=>x.classList.toggle('on',x===b));
  if (v==='dash' || v==='appts') { (v==='appts'?$('appts'):document.body).scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if (!current) return toast('اختر مراجعًا من القائمة أول');
  tab = v; render(D); $('work').scrollIntoView({behavior:'smooth',block:'start'});
});

async function start(){
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  CAT = CAT || await api('/catalog');
  ME = await api('/me');
  const doc = ME.doctor;
  $('docAv').textContent = doc.name_ar.replace('د. ','').trim().charAt(0);
  $('docName').textContent = doc.name_ar; $('docSpec').textContent = doc.specialty_ar;
  $('docPlace').textContent = doc.clinic_ar + ' · ' + ME.facility.name_ar;
  $('today').textContent = new Date().toLocaleDateString('ar-SA-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const A = ME.appointments;
  const msgs = A.reduce((n,a)=>n+(a.messages||0),0);
  $('sPat').textContent = new Set(A.map(a=>a.patient)).size;
  $('sUp').textContent = A.filter(a=>a.status!=='attended').length;
  $('sDone').textContent = A.filter(a=>a.status==='attended').length;
  $('sMsg').textContent = msgs;
  $('navMsgs').textContent = msgs; $('navMsgs').classList.toggle('hide', !msgs);
  $('bellDot').textContent = msgs; $('bellDot').classList.toggle('hide', !msgs);
  $('apptCount').textContent = A.length ? A.length+' مواعيد' : '';
  $('appts').innerHTML = A.length ? A.map((a,i)=>`
    <button class="appt ${current===a.patient?'on':''}" data-p="${a.patient}">
      ${avatar(a.alias,i)}
      <span class="who"><div class="t">${esc(a.alias)}</div>
        <div class="s">${esc(a.screening_ar)} · ${LANG[a.language]||a.language}${a.messages?` · ${a.messages} رسائل`:''}</div></span>
      <span class="tm">${a.status==='attended'?'<span class="pill gray">تمت الزيارة</span>':tm(a.start)}<small>${dy(a.start)}</small></span>
    </button>`).join('') : '<div class="empty">ما عندك مواعيد محجوزة الحين.</div>';
  document.querySelectorAll('.appt').forEach(b=>b.onclick=()=>open(b.dataset.p));
  if (current) open(current, true);
  else if (A.length) open((A.find(a=>a.status!=='attended')||A[0]).patient);
}

async function open(pid, keepTab){
  current = pid; if(!keepTab) tab='record';
  document.querySelectorAll('.appt').forEach(b=>b.classList.toggle('on', b.dataset.p===pid));
  D = await api('/patients/'+pid);
  render(D);
}

function render(d){
  const p = d.patient;
  const idx = Math.max(0, ME.appointments.findIndex(a=>a.patient===p.id));
  const a = ME.appointments[idx] || {};
  const last = d.records.filter(r=>r.source==='aoun')[0];
  const active = d.meds.filter(m=>m.active).length;
  const tags = [...p.prefs.map(x=>[PREF[x]||x,'t-blue']), ...p.family_history.map(x=>[FAM[x]||x,'t-amber'])];
  $('pcard').innerHTML = `
    <div class="ph">${avatar(p.alias, idx)}<div><h2>${esc(p.alias)}</h2><div class="s">حي ${esc(p.district_ar)} · ${a.screening_ar?esc(a.screening_ar):''}</div></div></div>
    <div class="facts">
      <div><small>العمر</small><b>${esc(p.age_band)}</b></div>
      <div><small>الجنس</small><b>${p.gender==='m'?'ذكر':'أنثى'}</b></div>
      <div><small>اللغة</small><b>${LANG[p.language]||p.language}</b></div>
      <div><small>الموعد</small><b>${a.start?dt(a.start):'—'}</b></div>
      <div><small>آخر نتيجة من عون</small><b>${last?date(last.taken_at):'—'}</b></div>
      <div><small>أدوية حالية</small><b>${active}</b></div>
    </div>
    <div class="tags">${tags.length?tags.map(([t,c])=>`<span class="tag ${c}">${esc(t)}</span>`).join(''):'<span class="tag t-teal">ما فيه تفضيلات أو تاريخ عائلي</span>'}</div>
    <div class="pacts">
      <button class="btn" data-go="result">${icon('flask')}إضافة نتيجة</button>
      <button class="btn ghost" data-go="notes">${icon('file')}المرفقات</button>
      <button class="btn ghost" data-go="chat">${icon('chat')}مراسلة</button>
    </div>`;
  document.querySelectorAll('#pcard [data-go]').forEach(b=>b.onclick=()=>{ tab=b.dataset.go; render(d); $('work').scrollIntoView({behavior:'smooth',block:'start'}); });

  const tabs = [['record','السجل الصحي','heart'],['result','إضافة نتيجة','flask'],['notes','الملاحظات والمرفقات','file'],['meds','الأدوية والفيتامينات','pill'],['chat','المراسلة','chat']];
  $('work').innerHTML = `
    <div class="tabs">${tabs.map(([k,l,i])=>`<button data-t="${k}" class="${tab===k?'on':''}">${icon(i)}${l}</button>`).join('')}</div>
    <div id="pane"></div>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t; render(d);});
  ({record:paneRecord, result:paneResult, notes:paneNotes, meds:paneMeds, chat:paneChat})[tab](d);
}

function flagPill(f){ if(!f) return ''; const [t,c]=FLAG[f]||[f,'']; return `<span class="pill ${c}">${t}</span>`; }

function paneRecord(d){
  const recs = d.records;
  $('pane').innerHTML = `
    <div class="info">السجل يجمع نتائج المراجع من كل المستشفيات والعيادات والمختبرات. فتحك له ينسجل ويشوفه المراجع في تطبيقه.</div>
    ${recs.length? recs.map(r=>`<div class="rec">
      <div><div style="font-weight:600">${esc(r.title_ar)} ${flagPill(r.flag)}</div>
        ${r.summary_ar?`<div style="color:var(--soft);font-size:14px">${esc(r.summary_ar)}</div>`:''}
        <div class="src">${esc(r.facility.name_ar)} · ${KIND[r.facility.kind]||''}${r.doctor?' · '+esc(r.doctor.name_ar):''} · ${date(r.taken_at)}</div>
        ${r.files.map(f=>`<button class="btn ghost small" data-f="${f.id}">${icon('file')}${esc(f.filename)}</button>`).join(' ')}</div>
      <div class="v">${r.value?esc(r.value)+' <small style="font-size:12px;color:var(--muted)">'+esc(r.unit||'')+'</small>':''}</div></div>`).join('') : '<div class="empty">ما فيه سجلات سابقة.</div>'}
    ${d.referrals.length?`<h3>الإحالات</h3>${d.referrals.map(r=>`<div class="note">${r.kind==='genetic_counselling'?'إحالة لاستشارة وراثية':'إحالة لمختص'} <small>· ${esc(r.doctor)} · ${date(r.created_at)}</small></div>`).join('')}`:''}`;
  bindFiles();
}

function bindFiles(){ document.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{
  const r = await fetch('/doctor/api/files/'+b.dataset.f,{headers:{authorization:'Bearer '+token}});
  if(!r.ok) return toast('ما قدرت أفتح الملف'); const url = URL.createObjectURL(await r.blob()); window.open(url,'_blank'); }); }

function paneResult(d){
  const opts = CAT.screenings.map(s=>`<option value="${s.key}">${esc(s.ar)}</option>`).join('');
  $('pane').innerHTML = `
    <div class="grid2"><div><label for="scr">الفحص</label><select id="scr">${opts}</select></div><div></div></div>
    <div id="tests"></div>
    <label for="sum">ملخص للمراجع (يطلع له في «نتائجي»)</label><textarea id="sum" maxlength="600" placeholder="مثال: النتيجة ضمن مرحلة ما قبل السكري، نعيد الفحص بعد ٦ أشهر."></textarea>
    <div style="margin-top:12px" class="row"><button class="btn" id="saveRes">حفظ النتيجة وإرسالها للمراجع</button></div>
    <h3>الأمراض الوراثية</h3>
    <div class="hint" style="margin-top:0">نتائج الفحوص الجينية ما تنحفظ في عون ولا تطلع في التطبيق. إذا احتاج المراجع، أرسل إحالة لاستشارة وراثية.</div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="refGen">إحالة لاستشارة وراثية</button><button class="btn ghost" id="refSpec">إحالة لمختص</button></div>`;
  const draw = () => { const s = CAT.screenings.find(x=>x.key===$('scr').value);
    $('tests').innerHTML = `<div class="grid2">${s.tests.map(t=>`<div><label>${esc(t.ar)} ${t.unit?'('+esc(t.unit)+')':''}${t.low!=null&&t.high!=null?` · الطبيعي ${t.low}–${t.high}`:''}</label>
      <input data-k="${t.key}" ${t.unit?'inputmode="decimal"':''} placeholder="${t.unit?'':'سلبي / إيجابي / BI-RADS 1'}"></div>`).join('')}</div>`; };
  $('scr').onchange = draw; draw();
  $('saveRes').onclick = async () => {
    const values = [...document.querySelectorAll('[data-k]')].filter(i=>i.value.trim()).map(i=>({test_key:i.dataset.k, value:i.value.trim()}));
    if(!values.length) return toast('اكتب قيمة وحدة على الأقل');
    await api(`/patients/${current}/results`,{method:'POST',body:JSON.stringify({screening:$('scr').value, values, summary:$('sum').value.trim()})});
    toast('انحفظت النتيجة ووصلت لتطبيق المراجع'); tab='record'; start();
  };
  $('refGen').onclick = async()=>{ await api(`/patients/${current}/referral`,{method:'POST',body:JSON.stringify({kind:'genetic_counselling'})}); toast('أُرسلت الإحالة'); };
  $('refSpec').onclick = async()=>{ await api(`/patients/${current}/referral`,{method:'POST',body:JSON.stringify({kind:'specialist'})}); toast('أُرسلت الإحالة'); };
}

function paneNotes(d){
  $('pane').innerHTML = `
    <label for="note">ملاحظة الطبيب (تطلع للمراجع في «ملاحظات الطبيب»)</label><textarea id="note" maxlength="2000"></textarea>
    <div style="margin-top:8px"><button class="btn" id="saveNote">إضافة الملاحظة</button></div>
    <h3>إرفاق تقرير أو صورة</h3>
    <div class="grid2"><div><label for="file">الملف (PDF أو صورة، حتى 5 ميجا)</label><input type="file" id="file" accept="application/pdf,image/png,image/jpeg"></div>
    <div><label for="recSel">ربطه بنتيجة (اختياري)</label><select id="recSel"><option value="">— بدون —</option>${d.records.filter(r=>r.source==='aoun').map(r=>`<option value="${r.id}">${esc(r.title_ar)} · ${date(r.taken_at)}</option>`).join('')}</select></div></div>
    <div style="margin-top:8px"><button class="btn" id="up">رفع الملف</button></div>
    <h3>الملاحظات السابقة</h3>
    ${d.notes.length? d.notes.map(n=>`<div class="note">${esc(n.body)}<br><small>${esc(n.doctor.name_ar)} · ${date(n.created_at)}</small></div>`).join('') : '<div class="empty">ما فيه ملاحظات.</div>'}
    ${d.files.length?`<h3>مرفقات</h3>${d.files.map(f=>`<button class="btn ghost small" data-f="${f.id}">${icon('file')}${esc(f.filename)}</button>`).join(' ')}`:''}`;
  bindFiles();
  $('saveNote').onclick = async()=>{ const b=$('note').value.trim(); if(!b) return; await api(`/patients/${current}/notes`,{method:'POST',body:JSON.stringify({body:b})}); toast('انحفظت الملاحظة'); open(current,true); };
  $('up').onclick = async()=>{ const f=$('file').files[0]; if(!f) return toast('اختر ملف');
    if(f.size>5*1024*1024) return toast('الملف أكبر من 5 ميجا');
    const b64 = await new Promise(res=>{const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.readAsDataURL(f);});
    await api(`/patients/${current}/files`,{method:'POST',body:JSON.stringify({filename:f.name, mime:f.type, data_b64:b64, record_id:$('recSel').value||null})});
    toast('انرفع الملف ووصل للمراجع'); open(current,true); };
}

function paneMeds(d){
  const times = new Set(['08:00']);
  $('pane').innerHTML = `
    <div class="chips" id="quick">${CAT.medicines.map((m,i)=>`<button class="chip" data-i="${i}">${esc(m.ar)} ${esc(m.dose)}</button>`).join('')}</div>
    <div class="grid2" style="margin-top:6px">
      <div><label for="mAr">الاسم بالعربي</label><input id="mAr"></div><div><label for="mEn">الاسم بالإنجليزي</label><input id="mEn" dir="ltr"></div>
      <div><label for="mKind">النوع</label><select id="mKind"><option value="medication">دواء</option><option value="vitamin">فيتامين</option><option value="supplement">مكمّل</option></select></div>
      <div><label for="mDose">الجرعة</label><input id="mDose"></div>
      <div><label for="mDays">المدة بالأيام (0 = مستمر)</label><input id="mDays" type="number" min="0" max="365" value="30"></div>
      <div><label for="mFood">مع الأكل؟</label><select id="mFood"><option value="0">لا يهم</option><option value="1">بعد الأكل</option></select></div>
    </div>
    <label for="tNew">أوقات الأخذ (يصل المراجع تذكير في كل وقت)</label>
    <div class="row"><div class="chips" id="times"></div><input id="tNew" type="time" style="width:130px"><button class="btn ghost small" id="tAdd">إضافة وقت</button></div>
    <label for="mIns">تعليمات</label><input id="mIns" maxlength="300">
    <div style="margin-top:12px"><button class="btn" id="saveMed">إضافة للخطة العلاجية</button></div>
    <h3>الأدوية الحالية والسابقة</h3>
    ${d.meds.length? d.meds.map(m=>`<div class="rec"><div><div style="font-weight:600">${esc(m.name_ar)} · ${esc(m.dose)} ${m.active?'<span class="pill">مستمر</span>':'<span class="pill gray">منتهي</span>'}</div>
      <div class="src">${m.times.join(' · ')} · ${m.days?m.days+' يوم':'مستمر'} · ${esc(m.facility_ar)}${m.doctor?' · '+esc(m.doctor.name_ar):''}</div></div>
      <div>${m.active?`<button class="btn ghost small" data-stop="${m.id}">إيقاف</button>`:''}</div></div>`).join('') : '<div class="empty">ما فيه أدوية.</div>'}`;
  const drawT = () => { $('times').innerHTML=[...times].sort().map(t=>`<button class="chip on" data-t="${t}">${t} ✕</button>`).join('');
    document.querySelectorAll('#times [data-t]').forEach(b=>b.onclick=()=>{times.delete(b.dataset.t); drawT();}); };
  drawT();
  $('tAdd').onclick = ()=>{ if($('tNew').value){ times.add($('tNew').value); drawT(); } };
  document.querySelectorAll('#quick [data-i]').forEach(b=>b.onclick=()=>{ const m=CAT.medicines[+b.dataset.i];
    $('mAr').value=m.ar; $('mEn').value=m.en; $('mKind').value=m.kind; $('mDose').value=m.dose; times.clear(); m.times.forEach(t=>times.add(t)); drawT(); });
  $('saveMed').onclick = async()=>{ if(!$('mAr').value.trim()||!$('mDose').value.trim()||!times.size) return toast('اكتب الاسم والجرعة ووقت واحد على الأقل');
    await api(`/patients/${current}/meds`,{method:'POST',body:JSON.stringify({kind:$('mKind').value,name_ar:$('mAr').value.trim(),name_en:$('mEn').value.trim(),dose:$('mDose').value.trim(),times:[...times],days:+$('mDays').value||0,with_food:$('mFood').value==='1',instructions:$('mIns').value.trim()})});
    toast('انضاف، وبتوصل المراجع تذكيرات بمواعيده'); open(current,true); };
  document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=async()=>{ await api(`/patients/${current}/meds/${b.dataset.stop}/stop`,{method:'POST'}); open(current,true); });
}

function paneChat(d){
  $('pane').innerHTML = `
    <div class="msgs" id="msgs">${d.messages.length? d.messages.map(m=>`<div class="msg ${m.sender==='doctor'?'me':'them'}">${esc(m.body)}<small>${dt(m.created_at)}</small></div>`).join('') : '<div class="empty">ابدأ المحادثة مع المراجع.</div>'}</div>
    <div class="row" style="margin-top:10px"><input id="msg" maxlength="1000" placeholder="اكتب رسالة…" aria-label="رسالة" style="flex:1"><button class="btn" id="send">إرسال</button></div>`;
  const box=$('msgs'); box.scrollTop=box.scrollHeight;
  const send = async()=>{ const b=$('msg').value.trim(); if(!b) return; await api(`/patients/${current}/messages`,{method:'POST',body:JSON.stringify({body:b})}); open(current,true); };
  $('send').onclick=send; $('msg').onkeydown=(e)=>{ if(e.key==='Enter') send(); };
}

token ? start().catch(()=>{}) : showLogin();
</script>
</body>
</html>
