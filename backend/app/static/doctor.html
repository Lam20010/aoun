<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عون · بوابة الطبيب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: dark-teal sidebar at the start edge; top bar with language and notifications; summary row;
   appointments beside the selected patient; the patient workspace below. One typeface (IBM Plex Sans Arabic,
   which carries Arabic and Latin), one type scale: 12 / 13 / 14 / 16 / 20 / 24. Colours are the Aoun app's. */
:root{
  --bg:#F3F8F6;--card:#FFFFFF;--ink:#173F42;--soft:#4E5C5E;--muted:#7E8C8E;--line:#E3ECEA;--line-2:#EDF3F1;
  --dark:#0F2E30;--dark-2:#173F42;--teal:#2F7F80;--teal-mid:#5AA7A7;--mint:#96D7C6;--mint-soft:#D5EFE8;--mint-card:#E9F6F2;
  --lav:#E3E8F6;--lav-ink:#3F5A8C;--yellow:#F6F0C4;--yellow-ink:#6B5A08;--lime:#BAC94A;
  --red:#B42318;--red-soft:#FDE8E4;--amber:#8A6D00;--amber-soft:#FBF3D2;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;--fs-2xl:24px;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-md)/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* controls */
.btn{border:1px solid transparent;border-radius:10px;padding:8px 14px;background:var(--dark);color:#fff;font-weight:600;font-size:var(--fs-md);display:inline-flex;align-items:center;gap:8px;line-height:1.4}
.btn:hover{background:var(--dark-2)}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--bg)}
.btn.small{padding:5px 10px;font-size:var(--fs-sm)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;font-size:var(--fs-md)}
input:focus,select:focus,textarea:focus{border-color:var(--teal-mid);outline:none;box-shadow:0 0 0 3px rgba(90,167,167,.18)}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:var(--fs-sm);font-weight:500;color:var(--soft);margin:12px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:20px}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);width:100%;max-width:960px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.login-art{background:linear-gradient(160deg,var(--dark),var(--dark-2));color:#E6F2EF;padding:40px 36px;display:flex;flex-direction:column;gap:14px}
.login-art img{width:52px;height:52px;background:#fff;border-radius:14px;padding:6px}
.login-art h2{margin:10px 0 0;font-size:var(--fs-2xl);font-weight:600;color:#fff;line-height:1.35}
.login-art p{margin:0;color:#B9D2CD;font-size:var(--fs-md)}
.login-art ul{margin:8px 0 0;padding-inline-start:18px;color:#D6E7E3;font-size:var(--fs-md);display:flex;flex-direction:column;gap:6px}
.login-art li::marker{color:var(--mint)}
.login-form{border:0;border-radius:0;padding:32px}
.ltitle{margin:26px 0 2px;font-size:var(--fs-xl);font-weight:600}
.lsub{color:var(--muted);font-size:var(--fs-sm)}
.pw{position:relative}
.pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--teal);font-size:var(--fs-sm);font-weight:600;padding:4px 8px}
.lerr{margin-top:10px;background:var(--red-soft);color:var(--red);border-radius:10px;padding:8px 12px;font-size:var(--fs-sm)}
.lfoot{margin-top:16px;color:var(--muted);font-size:var(--fs-xs);line-height:1.6}
@media (max-width:820px){.login-wrap{grid-template-columns:1fr}.login-art{display:none}}
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.lhead img{width:44px;height:44px}
.lhead h1{margin:0;font-size:var(--fs-xl);font-weight:600}
.lhead div div{color:var(--muted);font-size:var(--fs-sm)}
.hint{background:var(--yellow);color:var(--yellow-ink);border-radius:10px;padding:10px 12px;font-size:var(--fs-sm);margin-top:14px}
.lang-sw{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.lang-sw button{border:0;background:transparent;padding:6px 12px;font-size:var(--fs-sm);font-weight:600;color:var(--soft)}
.lang-sw button.on{background:var(--dark);color:#fff}

/* shell */
#app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--dark);color:#E6F2EF;padding:20px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.side .brand img{width:34px;height:34px;background:#fff;border-radius:9px;padding:4px}
.side .brand b{font-size:var(--fs-lg);font-weight:600;color:#fff}
.side .brand small{display:block;font-size:var(--fs-xs);color:#9DBAB5;font-weight:400}
.doc{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:var(--r);background:rgba(255,255,255,.06)}
.doc .av{width:44px;height:44px;border-radius:50%;background:var(--mint);color:var(--dark);display:grid;place-items:center;font-size:var(--fs-lg);font-weight:700;flex:none}
.doc b{display:block;font-size:var(--fs-md);font-weight:600;color:#fff}
.doc span{display:block;font-size:var(--fs-xs);color:#9DBAB5;line-height:1.5}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .cap{font-size:var(--fs-xs);color:#7FA19B;padding:0 12px 6px;letter-spacing:.02em}
.nav button{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:#C9DEDA;padding:9px 12px;border-radius:10px;text-align:start;font-size:var(--fs-md);font-weight:500;position:relative}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(150,215,198,.14);color:#fff}
.nav button.on::before{content:"";position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--mint)}
.nav .badge{margin-inline-start:auto;background:var(--lime);color:var(--dark);border-radius:999px;font-size:11px;padding:0 7px;font-weight:700;line-height:18px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side .foot small{font-size:var(--fs-xs);color:#7FA19B;padding:0 12px;line-height:1.5}

.main{display:flex;flex-direction:column;gap:20px;padding:20px 28px 40px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:var(--fs-2xl);font-weight:600;line-height:1.3}
.top .sub{font-size:var(--fs-sm);color:var(--muted)}
.acts{display:flex;align-items:center;gap:10px;position:relative}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--bg)}
.iconbtn .dot{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--teal);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}

/* notifications */
.panel{position:absolute;top:46px;inset-inline-end:0;width:360px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px rgba(15,46,48,.14);z-index:20;overflow:hidden}
.panel .ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel .ph b{font-size:var(--fs-lg);font-weight:600}
.panel .ph button{border:0;background:none;color:var(--teal);font-size:var(--fs-sm);font-weight:600}
.panel .items{max-height:420px;overflow:auto}
.nitem{display:flex;gap:12px;width:100%;border:0;background:#fff;text-align:start;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.nitem:hover{background:var(--bg)}
.nitem.new{background:var(--mint-card)}
.nitem .ni{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.nitem .nt{font-size:var(--fs-md);font-weight:500;line-height:1.45}
.nitem .ns{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.nitem .np{font-size:var(--fs-sm);color:var(--soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}

/* summary */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{display:flex;align-items:center;gap:14px;padding:16px 18px}
.stat .i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.stat small{display:block;color:var(--muted);font-size:var(--fs-sm)}
.stat b{display:block;font-size:var(--fs-2xl);font-weight:600;line-height:1.25}
.k-teal{background:var(--mint-soft);color:var(--teal)}
.k-lav{background:var(--lav);color:var(--lav-ink)}
.k-yel{background:var(--yellow);color:var(--yellow-ink)}
.k-dark{background:var(--dark);color:var(--mint)}

.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 10px}
.sec h2{margin:0;font-size:var(--fs-lg);font-weight:600}
.sec small{color:var(--muted);font-size:var(--fs-sm)}

/* appointments table */
.thead,.appt{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) 96px 104px;gap:12px;align-items:center}
.thead{padding:8px 18px;font-size:var(--fs-xs);color:var(--muted);font-weight:500;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.list{max-height:420px;overflow:auto}
.appt{width:100%;border:0;border-bottom:1px solid var(--line-2);background:#fff;text-align:start;padding:11px 18px}
.appt:hover{background:var(--bg)}
.appt.on{background:var(--mint-card)}
.appt .who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:600;font-size:var(--fs-sm)}
.appt .t{font-weight:600;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .s{font-size:var(--fs-xs);color:var(--muted)}
.appt .scr{font-size:var(--fs-sm);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .cst{display:block;font-size:var(--fs-xs);color:var(--teal);font-weight:500}
.appt .cst.paid{color:var(--amber)}
.sehref{display:flex;gap:8px;align-items:center;margin:0 18px;padding:8px 12px;background:var(--bg);border-radius:10px;font-size:var(--fs-sm);color:var(--soft)}
.appt .tm{font-weight:600;font-size:var(--fs-md)}
.appt .tm small{display:block;font-weight:400;font-size:var(--fs-xs);color:var(--muted)}

/* patient card */
.pc-top{padding:18px;background:var(--mint-card);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;display:flex;gap:14px;align-items:center}
.pc-top .av{width:52px;height:52px;font-size:var(--fs-lg);background:#fff!important}
.pc-top h3{margin:0;font-size:var(--fs-xl);font-weight:600;line-height:1.3}
.pc-top .s{font-size:var(--fs-sm);color:var(--soft)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 12px;padding:18px}
.facts small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.facts b{font-size:var(--fs-md);font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px}
.tag{border-radius:8px;padding:2px 10px;font-size:var(--fs-xs);font-weight:600;line-height:22px}
.pacts{display:flex;gap:8px;flex-wrap:wrap;padding:16px 18px 18px}

.pill{display:inline-block;border-radius:999px;padding:0 10px;font-size:var(--fs-xs);font-weight:600;line-height:22px;background:var(--mint-soft);color:var(--teal);white-space:nowrap}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.gray{background:#EEF2F1;color:var(--soft)}
.pill.lav{background:var(--lav);color:var(--lav-ink)}

/* workspace */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 12px}
.tabs button{border:0;background:transparent;padding:14px 10px;font-weight:500;font-size:var(--fs-md);color:var(--soft);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:8px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--teal)}
#pane{padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.rec:last-child{border-bottom:0}
.rec .tt{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec .ds{color:var(--soft);font-size:var(--fs-md)}
.rec .v{font-weight:600;font-size:var(--fs-lg);text-align:end}
.rec .v small{display:block;font-size:var(--fs-xs);color:var(--muted);font-weight:400}
.rec .src{font-size:var(--fs-xs);color:var(--muted)}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto;padding:4px}
.msg{max-width:75%;padding:9px 12px;border-radius:12px;background:var(--mint-soft);font-size:var(--fs-md)}
.msg.me{align-self:flex-start;background:var(--dark);color:#fff}
.msg.them{align-self:flex-end}
.msg small{display:block;opacity:.7;font-size:var(--fs-xs)}
.trbtn{border:0;background:none;padding:0;margin-top:2px;font-size:var(--fs-xs);font-weight:600;color:var(--teal)}
.msg.me .trbtn{color:var(--mint)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:var(--fs-sm);background:#fff}
.chip:hover{border-color:var(--teal-mid)}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.empty{color:var(--muted);text-align:center;padding:36px 10px;font-size:var(--fs-md)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:10px;font-weight:500;z-index:30}
.note{background:var(--yellow);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.note small{color:var(--yellow-ink);font-size:var(--fs-xs)}
h4{margin:22px 0 8px;font-size:var(--fs-lg);font-weight:600}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--lav);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:var(--fs-sm);margin-bottom:6px}

@media (max-width:1180px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
@media (max-width:860px){#app{grid-template-columns:1fr}.side{position:static;height:auto;gap:14px}.nav{flex-direction:row;flex-wrap:wrap}.nav .cap,.side .foot small,.doc{display:none}.side .foot{margin-top:0}.main{padding:16px}}
@media (max-width:560px){.grid2,.facts{grid-template-columns:1fr 1fr}.thead{display:none}.appt{grid-template-columns:minmax(0,1fr) auto}.appt .scr,.appt .st{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>

</svg>

<section id="login" class="hide">

let lang = ls.get('aoun_dr_lang') === 'en' ? 'en' : 'ar';

const date = (s) => fmt(s, {day:'numeric',month:'short',year:'numeric'});
const dt = (s) => fmt(s, {weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const tm = (s) => fmt(s, {hour:'numeric',minute:'2-digit'});
const dy = (s) => fmt(s, {weekday:'short',day:'numeric',month:'short'});
const ago = (s) => { const m = Math.max(0, Math.round((Date.now() - new Date(s).getTime()) / 60000)); return m < 1 ? t('now') : m < 60 ? t('minAgo',{n:m}) : m < 1440 ? t('hrAgo',{n:Math.round(m/60)}) : date(s); };
const LANG = {ar:'العربية',en:'English',ur:'اردو',hi:'हिन्दी',bn:'বাংলা',fil:'Filipino',id:'Indonesia'};

const AVC = [['var(--mint-soft)','var(--teal)'],['var(--lav)','var(--lav-ink)'],['var(--yellow)','var(--yellow-ink)'],['#E6EFEC','var(--ink)']];

const icon = (n) => `<svg class="ico"><use href="#i-${n}"/></svg>`;
const avatar = (alias, i) => { const [b,f] = AVC[i % AVC.length]; return `<span class="av" style="background:${b};color:${f}">${esc(String(alias).split('#').pop().slice(0,2))}</span>`; };

let token = ss.get('aoun_dr');
let CAT = null, ME = null, CFG = null, current = null, tab = 'record', D = null, NOTI = [], ORIG = {};

function applyLang(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.title = lang === 'en' ? 'Aoun · Doctor portal' : 'عون · بوابة الطبيب';
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll('[data-langsw]').forEach(w => {
    w.innerHTML = `<button data-l="ar" class="${lang==='ar'?'on':''}">ع</button><button data-l="en" class="${lang==='en'?'on':''}">EN</button>`;
    w.querySelectorAll('button').forEach(b => b.onclick = () => { lang = b.dataset.l; ls.set('aoun_dr_lang', lang); applyLang(); redraw(); });
  });
}
function redraw(){
  if (!$('login').classList.contains('hide') && CFG) fillDoctors();
  if (ME) { drawShell(); if (current) open(current, true); loadNoti(); }
}

function toast(x){const e=$('toast');e.textContent=x;e.classList.remove('hide');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hide'),2600)}
async function api(path, opts={}){
  const r = await fetch('/doctor/api'+path, {...opts, headers:{'content-type':'application/json', ...(token?{authorization:'Bearer '+token}:{}) }});
  if (r.status===401){ token=''; ss.del('aoun_dr'); showLogin(); throw new Error('401'); }
  const j = await r.json().catch(()=>({}));
  if (!r.ok) { toast(({genetic_results_are_not_stored:t('eGenetic'),file_too_large:t('eBig'),pdf_png_or_jpeg_only:t('eType'),not_your_patient:t('eNotYours')})[String(j.detail||'').split(':')[0]] || t('eGeneric')); throw new Error(j.detail); }
  return j;
}

function fillDoctors(){
  $('pwShow').textContent = $('code').type === 'password' ? t('show') : t('hide');
}
async function showLogin(){
  $('app').classList.add('hide'); $('login').classList.remove('hide');
  try { CFG = await fetch('/doctor/api/config').then(r=>r.json()); } catch(e) { CFG = {}; }
  fillDoctors(); setTimeout(() => $('docId').focus(), 50);
}
$('pwShow').onclick = () => { const i = $('code'); i.type = i.type === 'password' ? 'text' : 'password'; $('pwShow').textContent = i.type === 'password' ? t('show') : t('hide'); };
$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const id = $('docId').value.trim().toUpperCase(), pw = $('code').value;
  const err = (m) => { $('loginErr').textContent = m; $('loginErr').classList.remove('hide'); };
  $('loginErr').classList.add('hide');
  if (!id || !pw) return err(t('eMissing'));
  $('loginBtn').disabled = true;
  try {
    const r = await fetch('/doctor/api/login', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({doctor_id:id, password:pw})});
    if (r.status === 429) return err(t('eLocked'));
    if (!r.ok) return err(t('eLogin'));
    token = (await r.json()).token; ss.set('aoun_dr', token); $('code').value = ''; start();
  } catch (x) { err(t('eGeneric')); } finally { $('loginBtn').disabled = false; }
};
$('logout').onclick = () => { token=''; ss.del('aoun_dr'); current=null; D=null; ME=null; showLogin(); };
document.querySelectorAll('#nav [data-v]').forEach(b=>b.onclick=()=>{
  const v=b.dataset.v; document.querySelectorAll('#nav [data-v]').forEach(x=>x.classList.toggle('on',x===b));
  if (v==='dash') return window.scrollTo({top:0,behavior:'smooth'});
  if (v==='appts') return $('apptCard').scrollIntoView({behavior:'smooth',block:'start'});
  if (!current) return toast(t('pickFirst'));
  tab = v; render(D); $('work').scrollIntoView({behavior:'smooth',block:'start'});
});

const seenKey = () => 'aoun_dr_seen_' + (ME ? ME.doctor.id : '');
function drawNoti(){
  const seen = ls.get(seenKey());
  const fresh = NOTI.filter(n => !seen || n.at > seen).length;
  $('bellDot').textContent = fresh; $('bellDot').classList.toggle('hide', !fresh);
  const st = { booking:['cal','k-lav','nBooking'], message:['chat','k-yel','nMessage'], soon:['clock','k-teal','nSoon'], ministry:['shield','k-teal','nMinistry'] };
  $('nItems').innerHTML = NOTI.length ? NOTI.map((n,i) => { const [ic,k,key] = st[n.kind] || st.booking; return `
    <button class="nitem ${(!seen || n.at > seen)?'new':''}" data-i="${i}">
      <span class="ni ${k}">${icon(ic)}</span>
      <span style="min-width:0"><div class="nt">${esc(t(key,{a:n.kind==='ministry'?pk(n,'title'):al(n.alias)}))}</div>
        ${n.preview?`<div class="np" dir="auto">${esc(n.preview)}</div>`:''}${n.kind==='ministry'?`<div class="np">${esc(pk(n,'detail'))}</div>`:''}
        <div class="ns num">${n.kind==='message'||n.kind==='ministry'?ago(n.at):dt(n.start)}${n.screening_ar?' · '+esc(pk(n,'screening')):''}</div></span>
    </button>`; }).join('') : `<div class="empty">${t('noNotifications')}</div>`;
  document.querySelectorAll('#nItems [data-i]').forEach(b => b.onclick = () => { const n = NOTI[+b.dataset.i]; closePanel(); if (n.kind==='ministry') return; open(n.patient, false, n.kind==='message'?'chat':'record'); });
}
async function loadNoti(){ try { NOTI = (await api('/notifications?lang='+lang)).items || []; drawNoti(); } catch(e){} }
function closePanel(){ $('panel').classList.add('hide'); $('bell').setAttribute('aria-expanded','false'); }
$('bell').onclick = (e) => { e.stopPropagation(); const p=$('panel'); p.classList.toggle('hide'); $('bell').setAttribute('aria-expanded', String(!p.classList.contains('hide'))); };
$('readAll').onclick = () => { if (NOTI.length) ls.set(seenKey(), NOTI[0].at > new Date().toISOString() ? NOTI[0].at : new Date().toISOString()); drawNoti(); };
document.addEventListener('click', (e) => { if (!$('panel').contains(e.target) && e.target !== $('bell')) closePanel(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

async function start(){

  drawShell(); loadNoti();
  clearInterval(start._p); start._p = setInterval(loadNoti, 30000);

  $('docPlace').textContent = pk(doc,'clinic') + ' · ' + pk(ME.facility,'name');
  $('todayDate').textContent = fmt(new Date().toISOString(), {weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const msgs = A.reduce((n,a)=>n+(a.messages||0),0);

  document.querySelectorAll('.appt').forEach(b=>b.onclick=()=>open(b.dataset.p));

  const tabs = [['record','tRecord','heart'],['result','tResult','flask'],['notes','tNotes','file'],['meds','tMeds','pill'],['chat','tChat','chat']];
  $('work').innerHTML = `
    <div class="tabs" role="tablist">${tabs.map(([k,l,i])=>`<button role="tab" data-t2="${k}" class="${tab===k?'on':''}">${icon(i)}${t(l)}</button>`).join('')}</div>
    <div id="pane"></div>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t2; render(d);});
  ({record:paneRecord, result:paneResult, notes:paneNotes, meds:paneMeds, chat:paneChat})[tab](d);
}

const flagPill = (f) => f ? `<span class="pill ${FLAGC[f]||''}">${t(f)}</span>` : '';

function paneRecord(d){
  const recs = d.records;
  $('pane').innerHTML = `
    <div class="info">${icon('shield')}<span>${t('recordInfo')}</span></div>
    ${recs.length? recs.map(r=>`<div class="rec">
      <div style="min-width:0"><div class="tt">${esc(pk(r,'title'))} ${flagPill(r.flag)}</div>
        ${pk(r,'summary')?`<div class="ds">${esc(pk(r,'summary'))}</div>`:''}
        <div class="src num">${esc(pk(r.facility,'name'))} · ${t(r.facility.kind)}${r.doctor?' · '+esc(pk(r.doctor,'name')):''} · ${date(r.taken_at)}</div>
        ${r.files.length?`<div class="row" style="margin-top:6px">${r.files.map(f=>`<button class="btn ghost small" data-f="${f.id}">${icon('file')}${esc(f.filename)}</button>`).join('')}</div>`:''}</div>
      <div class="v num">${r.value?esc(r.value):''}${r.value?`<small>${esc(r.unit||'')}${r.range&&r.range.low!=null?' · '+t('normalRange',{a:r.range.low,b:r.range.high}):''}</small>`:''}</div></div>`).join('') : `<div class="empty">${t('noRecords')}</div>`}
    ${d.referrals.length?`<h4>${t('referrals')}</h4>${d.referrals.map(r=>`<div class="note">${r.kind==='genetic_counselling'?t('refGenetic'):t('refSpecialist')} <small>· ${esc(lang==='en'?(r.doctor_en||r.doctor):r.doctor)} · ${date(r.created_at)}</small></div>`).join('')}`:''}`;
  bindFiles();
}

function bindFiles(){ document.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{
  const r = await fetch('/doctor/api/files/'+b.dataset.f,{headers:{authorization:'Bearer '+token}});
  if(!r.ok) return toast(t('eOpen')); const url = URL.createObjectURL(await r.blob()); window.open(url,'_blank'); }); }

function paneResult(d){
  const opts = CAT.screenings.map(s=>`<option value="${s.key}">${esc(lang==='en'?s.en:s.ar)}</option>`).join('');
  $('pane').innerHTML = `
    <div class="grid2"><div><label for="scr">${t('screening')}</label><select id="scr">${opts}</select></div><div></div></div>
    <div id="tests"></div>
    <label for="sum">${t('summary')}</label><textarea id="sum" maxlength="600" placeholder="${esc(t('summaryPh'))}"></textarea>
    <div style="margin-top:14px" class="row"><button class="btn" id="saveRes">${icon('check')}${t('saveResult')}</button></div>
    <h4>${t('genetic')}</h4>
    <div class="hint" style="margin-top:0">${t('geneticNote')}</div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="refGen">${t('refGenetic')}</button><button class="btn ghost" id="refSpec">${t('refSpecialist')}</button></div>`;
  const draw = () => { const s = CAT.screenings.find(x=>x.key===$('scr').value);
    $('tests').innerHTML = `<div class="grid2">${s.tests.map(x=>`<div><label>${esc(lang==='en'?x.en:x.ar)} ${x.unit?'('+esc(x.unit)+')':''}${x.low!=null&&x.high!=null?' · '+t('normalRange',{a:x.low,b:x.high}):''}</label>
      <input data-k="${x.key}" ${x.unit?'inputmode="decimal"':''} placeholder="${x.unit?'':esc(t('qualPh'))}"></div>`).join('')}</div>`; };
  $('scr').onchange = draw; draw();
  $('saveRes').onclick = async () => {
    const values = [...document.querySelectorAll('[data-k]')].filter(i=>i.value.trim()).map(i=>({test_key:i.dataset.k, value:i.value.trim()}));
    if(!values.length) return toast(t('eValue'));
    await api(`/patients/${current}/results`,{method:'POST',body:JSON.stringify({screening:$('scr').value, values, summary:$('sum').value.trim()})});
    toast(t('tSaved')); tab='record'; start();
  };
  $('refGen').onclick = async()=>{ await api(`/patients/${current}/referral`,{method:'POST',body:JSON.stringify({kind:'genetic_counselling'})}); toast(t('tRef')); };
  $('refSpec').onclick = async()=>{ await api(`/patients/${current}/referral`,{method:'POST',body:JSON.stringify({kind:'specialist'})}); toast(t('tRef')); };
}

function paneNotes(d){
  $('pane').innerHTML = `
    <label for="note">${t('noteLabel')}</label><textarea id="note" maxlength="2000"></textarea>
    <div style="margin-top:10px"><button class="btn" id="saveNote">${t('addNote')}</button></div>
    <h4>${t('attach')}</h4>
    <div class="grid2"><div><label for="file">${t('fileLabel')}</label><input type="file" id="file" accept="application/pdf,image/png,image/jpeg"></div>
    <div><label for="recSel">${t('linkResult')}</label><select id="recSel"><option value="">${t('none')}</option>${d.records.filter(r=>r.source==='aoun').map(r=>`<option value="${r.id}">${esc(pk(r,'title'))} · ${date(r.taken_at)}</option>`).join('')}</select></div></div>
    <div style="margin-top:10px"><button class="btn" id="up">${icon('file')}${t('upload')}</button></div>
    <h4>${t('prevNotes')}</h4>
    ${d.notes.length? d.notes.map(n=>`<div class="note" dir="auto">${esc(n.body)}<br><small>${esc(pk(n.doctor,'name'))} · ${date(n.created_at)}</small></div>`).join('') : `<div class="empty">${t('noNotes')}</div>`}
    ${d.files.length?`<h4>${t('attachments')}</h4><div class="row">${d.files.map(f=>`<button class="btn ghost small" data-f="${f.id}">${icon('file')}${esc(f.filename)}</button>`).join('')}</div>`:''}`;
  bindFiles();
  $('saveNote').onclick = async()=>{ const b=$('note').value.trim(); if(!b) return; await api(`/patients/${current}/notes`,{method:'POST',body:JSON.stringify({body:b})}); toast(t('tNote')); open(current,true); };
  $('up').onclick = async()=>{ const f=$('file').files[0]; if(!f) return toast(t('eFile'));
    if(f.size>5*1024*1024) return toast(t('eBig'));
    const b64 = await new Promise(res=>{const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.readAsDataURL(f);});
    await api(`/patients/${current}/files`,{method:'POST',body:JSON.stringify({filename:f.name, mime:f.type, data_b64:b64, record_id:$('recSel').value||null})});
    toast(t('tFile')); open(current,true); };
}

function paneMeds(d){
  const times = new Set(['08:00']);
  $('pane').innerHTML = `
    <div class="chips" id="quick">${CAT.medicines.map((m,i)=>`<button class="chip" data-i="${i}">${esc(lang==='en'?m.en:m.ar)} · ${esc(m.dose)}</button>`).join('')}</div>
    <div class="grid2" style="margin-top:4px">
      <div><label for="mAr">${t('nameAr')}</label><input id="mAr" dir="rtl"></div><div><label for="mEn">${t('nameEn')}</label><input id="mEn" dir="ltr"></div>
      <div><label for="mKind">${t('kind')}</label><select id="mKind"><option value="medication">${t('medication')}</option><option value="vitamin">${t('vitamin')}</option><option value="supplement">${t('supplement')}</option></select></div>
      <div><label for="mDose">${t('dose')}</label><input id="mDose"></div>
      <div><label for="mDays">${t('days')}</label><input id="mDays" type="number" min="0" max="365" value="30"></div>
      <div><label for="mFood">${t('food')}</label><select id="mFood"><option value="0">${t('anyTime')}</option><option value="1">${t('afterFood')}</option></select></div>
    </div>
    <label for="tNew">${t('times')}</label>
    <div class="row"><div class="chips" id="times"></div><input id="tNew" type="time" style="width:140px"><button class="btn ghost small" id="tAdd">${t('addTime')}</button></div>
    <label for="mIns">${t('instructions')}</label><input id="mIns" maxlength="300">
    <div style="margin-top:14px"><button class="btn" id="saveMed">${icon('pill')}${t('addMed')}</button></div>
    <h4>${t('medsList')}</h4>
    ${d.meds.length? d.meds.map(m=>`<div class="rec"><div style="min-width:0"><div class="tt">${esc(pk(m,'name'))} · <span class="num">${esc(m.dose)}</span> ${m.active?`<span class="pill">${t('ongoing')}</span>`:`<span class="pill gray">${t('ended')}</span>`}</div>
      <div class="src num">${m.times.map(x=>tm('2026-01-01T'+x+':00+03:00')).join(' · ')} · ${m.days?t('nDays',{n:m.days}):t('ongoing')} · ${esc(pk(m,'facility'))}${m.doctor?' · '+esc(pk(m.doctor,'name')):''}</div></div>
      <div>${m.active?`<button class="btn ghost small" data-stop="${m.id}">${t('stop')}</button>`:''}</div></div>`).join('') : `<div class="empty">${t('noMeds')}</div>`}`;
  const drawT = () => { $('times').innerHTML=[...times].sort().map(x=>`<button class="chip on num" data-tt="${x}">${x} ✕</button>`).join('');
    document.querySelectorAll('#times [data-tt]').forEach(b=>b.onclick=()=>{times.delete(b.dataset.tt); drawT();}); };
  drawT();
  $('tAdd').onclick = ()=>{ if($('tNew').value){ times.add($('tNew').value); drawT(); } };
  document.querySelectorAll('#quick [data-i]').forEach(b=>b.onclick=()=>{ const m=CAT.medicines[+b.dataset.i];
    $('mAr').value=m.ar; $('mEn').value=m.en; $('mKind').value=m.kind; $('mDose').value=m.dose; times.clear(); m.times.forEach(x=>times.add(x)); drawT(); });
  $('saveMed').onclick = async()=>{ if(!$('mAr').value.trim()||!$('mDose').value.trim()||!times.size) return toast(t('eMed'));
    await api(`/patients/${current}/meds`,{method:'POST',body:JSON.stringify({kind:$('mKind').value,name_ar:$('mAr').value.trim(),name_en:$('mEn').value.trim(),dose:$('mDose').value.trim(),times:[...times],days:+$('mDays').value||0,with_food:$('mFood').value==='1',instructions:$('mIns').value.trim()})});
    toast(t('tMed')); open(current,true); };
  document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=async()=>{ await api(`/patients/${current}/meds/${b.dataset.stop}/stop`,{method:'POST'}); open(current,true); });
}

function paneChat(d){
  $('pane').innerHTML = `
    <div class="msgs" id="msgs">${d.messages.length? d.messages.map(m=>{ const tr = m.translated && !ORIG[m.id]; return `<div class="msg ${m.sender==='doctor'?'me':'them'}"><div dir="auto">${esc(tr?m.translated:m.body)}</div><small class="num">${dt(m.created_at)}</small>${m.translated?`<button class="trbtn" data-orig="${m.id}">${tr?t('translatedLbl')+' · '+t('showOriginal'):t('showTranslation')}</button>`:''}</div>`; }).join('') : `<div class="empty">${t('startChat')}</div>`}</div>
    <div class="row" style="margin-top:12px"><input id="msg" maxlength="1000" placeholder="${esc(t('typeMsg'))}" aria-label="${esc(t('typeMsg'))}" style="flex:1"><button class="btn" id="send">${t('send')}</button></div>`;
  const box=$('msgs'); box.scrollTop=box.scrollHeight;
  document.querySelectorAll('[data-orig]').forEach(b=>b.onclick=()=>{ ORIG[b.dataset.orig]=!ORIG[b.dataset.orig]; paneChat(d); });
  const send = async()=>{ const b=$('msg').value.trim(); if(!b) return; await api(`/patients/${current}/messages`,{method:'POST',body:JSON.stringify({body:b})}); open(current,true); };
  $('send').onclick=send; $('msg').onkeydown=(e)=>{ if(e.key==='Enter') send(); };
}

applyLang();
token ? start().catch(()=>{}) : showLogin();
</script>
</body>
</html>
